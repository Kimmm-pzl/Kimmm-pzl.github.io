short_bio: >-
  <p>
    I am a second-year Master's student at
    <a href="https://www.pkusz.edu.cn/" target="_blank">Peking University Shenzhen Graduate School</a>,
    advised by the School of Electronic and Computer Engineering.
  </p>
  <p>
    My research interests focus on <strong>Embodied AI</strong> and <strong>Video Generation</strong>. I work on video-model
    evaluation, large-scale robotic data curation, multimodal training, and
    efficient video-based action modeling. My goal is to bridge generative world
    models with downstream control for reliable robotic execution.
  </p>

